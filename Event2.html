<!DOCTYPE html>
<html lang="fr">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #050814;
      color: #e5e7eb;
      min-height: 100vh;
    }

    .page {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
    }

    .page-sub {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 4px;
    }

    .week-toggle {
      display: inline-flex;
      background: #1a1d29;
      border-radius: 8px;
      padding: 4px;
      gap: 4px;
    }

    .week-toggle button {
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: #9ca3af;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .week-toggle button:hover {
      background: #252938;
      color: #e5e7eb;
    }

    .week-toggle button.active {
      background: #3b82f6;
      color: #fff;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: 80px repeat(7, 1fr);
      gap: 1px;
      background: #1a1d29;
      border-radius: 8px;
      overflow: hidden;
    }

    .calendar-header {
      background: #1a1d29;
      padding: 12px 8px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      color: #fff;
    }

    .time-cell {
      background: #1a1d29;
      padding: 12px 8px;
      text-align: center;
      font-weight: 500;
      font-size: 13px;
      color: #9ca3af;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .event-cell {
      background: #0f1117;
      padding: 6px;
      min-height: 40px;
      position: relative;
    }

    .boss-icons {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 6px;
    }

    .boss-icon {
      position: relative;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      overflow: hidden;
      background: #1a1d29;
    }

    .boss-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .boss-icon[data-boss-type="archiboss"] {
      border: 2px solid #ef4444;
    }

    .boss-icon[data-boss-type="ascendant"] {
      border: 2px solid #f59e0b;
    }

    .boss-icon[data-boss-type="normal"] {
      border: 2px solid #6b7280;
    }

                  <div class="event-icon ${eventClass} ${hasNotif ? 'has-notification' : ''}"

                       data-day="${day}"

      });

      calendar.innerHTML = html;

      // Ajouter les gestionnaires de clic après le rendu
      setTimeout(() => {
        document.querySelectorAll('.event-icon, .boss-small, .boss-full').forEach(elem => {
          elem.style.cursor = 'pointer';
          elem.addEventListener('click', function(e) {
            e.stopPropagation();
            const day = this.getAttribute('data-day');
            const time = this.getAttribute('data-time');
            const itemName = this.getAttribute('data-item-name');
            const itemType = this.getAttribute('data-item-type');
            if (day && time && itemName) {
              toggleNotification(day, time, itemName, itemType);
            }
          });
        });
      }, 50);
    }

    function switchWeek(week) {
      currentWeek = week;
      document.querySelectorAll('.week-toggle button').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${week}`).classList.add('active');
      renderCalendar();
    }

    renderCalendar();
  
    setupNotificationTimers();
    setInterval(() => {
      renderCalendar();
    }, 60000);

  (function(){var h=false;function t(m){if(m<=0)return"Maintenant!";var s=Math.floor(m/1000),n=Math.floor(s/60),o=Math.floor(n/60),d=Math.floor(o/24);if(d>0)return d+"j "+(o%24)+"h";if(o>0)return o+"h "+(n%60)+"m";if(n>0)return n+"m "+(s%60)+"s";return s+"s"}function u(){var a=document.getElementById('notif-next'),b=document.getElementById('notif-list');if(!a||!b)return;var c=[];try{var s=localStorage.getItem('calendarNotifications');if(s)c=JSON.parse(s)}catch(e){}if(c.length===0){a.style.display='none';b.innerHTML='<div style="text-align:center;padding:20px;color:#9ca3af;font-size:12px;">Aucune notification.<br><br>Cliquez sur un événement!</div>';return}var n=new Date(),p=[],i;c.forEach(function(v,x){var et=null;if(typeof getEventDateTime==='function'){try{et=getEventDateTime(v.day,v.time,v.week)}catch(e){}}if(et){var df=et.getTime()-n.getTime();if(df>0)p.push({idx:x,name:v.itemName,day:v.day,time:v.time,ms:df})}});p.sort(function(a,b){return a.ms-b.ms});if(p.length>0){var f=p[0];a.innerHTML='<div style="background:linear-gradient(135deg,#667eea,#764ba2);padding:12px;border-radius:8px;margin-bottom:12px;color:white;"><div style="font-size:10px;opacity:0.9;margin-bottom:4px;">Prochain événement</div><div style="font-size:14px;font-weight:700;margin-bottom:6px;">'+f.name+'</div><div style="font-size:24px;font-weight:700;font-family:monospace;text-align:center;padding:8px;background:rgba(0,0,0,0.2);border-radius:6px;margin-bottom:4px;">'+t(f.ms)+'</div><div style="font-size:11px;opacity:0.9;text-align:center;">'+f.day+' à '+f.time+'</div></div>';a.style.display='block'}else a.style.display='none';var htm='';p.forEach(function(e){htm+='<div style="background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.3);border-radius:6px;padding:8px 10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;"><div style="flex:1;"><div style="font-size:12px;font-weight:600;color:#e5e7eb;margin-bottom:2px;">'+e.name+'</div><div style="font-size:10px;color:#9ca3af;">'+e.day+' '+e.time+' (dans '+t(e.ms)+')</div></div><button onclick="window.rmNotif('+e.idx+')" style="background:rgba(239,68,68,0.2);border:1px solid rgba(239,68,68,0.4);color:#ef4444;width:22px;height:22px;border-radius:4px;cursor:pointer;font-size:14px;">✕</button></div>'});if(htm==='')htm='<div style="text-align:center;padding:20px;color:#9ca3af;font-size:12px;">Tous passés</div>';b.innerHTML=htm}window.rmNotif=function(i){var l=JSON.parse(localStorage.getItem('calendarNotifications')||'[]');l.splice(i,1);localStorage.setItem('calendarNotifications',JSON.stringify(l));u();if(typeof renderCalendar==='function')renderCalendar()};setTimeout(function(){var hd=document.getElementById('notif-header'),bd=document.getElementById('notif-body'),tg=document.getElementById('notif-toggle');if(hd)hd.onclick=function(){h=!h;if(h){bd.style.display='none';tg.textContent='+'}else{bd.style.display='block';tg.textContent='−'}};u();setInterval(u,2000)},500)})();
  </script>
